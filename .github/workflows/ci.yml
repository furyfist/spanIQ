name: CI
on: [push, pull_request]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      # Pinned so a new ruff release cannot turn the build red on its own.
      # Keep in sync with the `dev` extra in pyproject.toml.
      - run: pip install "ruff==0.15.16"
      - run: ruff check .
      - run: ruff format --check .

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # every version pyproject.toml claims to support
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: pip install -e ".[dev,viz]"
      # The benchmark's optional judges (ragas/deepeval/groq) are not installed;
      # those tests skip themselves and the rest of the suite runs.
      - run: pytest -q

  wheel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install build
      - run: python -m build --wheel
      # generated demo outputs must not ship in the package
      - run: |
          if unzip -l dist/*.whl | grep -E "demos/output/|attribution\.png"; then
            echo "generated files found in wheel"; exit 1
          fi
